[pytest]
# Limite pytest au code de l'étudiant : les dossiers "corrections/" contiennent
# d'anciennes versions de référence du cours et ne doivent jamais être testés.
# Sans cette limite, pytest trouve plusieurs fichiers "test_main.py" portant
# le même nom dans le dépôt et refuse de les collecter tous les deux.
testpaths = familytask/backend
